<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Органайзер</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f4f0">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233f5f52'/><path d='M10 16.5l4 4 8-9' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --sunken:#efede8;
  --text:#1c1c1a; --text2:#55534e; --muted:#94918a; --line:#e6e3dc; --line2:#d9d6ce;
  --accent:#3f5f52; --accent-soft:#e6ece8; --on-accent:#fff;
  --warn:#a4553e;
  --radius:14px; --shadow:0 1px 2px rgba(30,28,24,.04),0 4px 16px rgba(30,28,24,.04);
  --font:"Inter","Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --display:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
body.dark{
  --bg:#151514; --surface:#1c1c1a; --sunken:#232321;
  --text:#ecebe6; --text2:#b5b3ac; --muted:#7d7b75; --line:#2b2a27; --line2:#3a3935;
  --accent:#93b5a5; --accent-soft:#25302b; --on-accent:#14201b;
  --warn:#d98c74; --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14.5px/1.5 var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
svg.i.s{width:14px;height:14px;stroke-width:1.7;vertical-align:-2px}
::selection{background:var(--accent-soft)}

/* ---------- каркас ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
aside{background:var(--bg);border-right:1px solid var(--line);padding:28px 16px 20px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.brand .mark svg{width:16px;height:16px;stroke-width:2.2}
.brand b{font:600 15px/1 var(--display);letter-spacing:-.01em}
.navgroup{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:18px 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:7px 10px;border-radius:9px;color:var(--text2);text-align:left}
.nav:hover{background:var(--sunken);color:var(--text)}
.nav.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:550}
body.dark .nav.active{background:var(--sunken)}
.nav.active svg{color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .cnt.hot{color:var(--warn)}
.aside-foot{margin-top:auto;padding-top:18px;display:flex;gap:4px}
.ghostbtn{border:0;background:transparent;color:var(--text2);padding:8px;border-radius:9px;display:inline-flex;align-items:center;gap:8px}
.ghostbtn:hover{background:var(--sunken);color:var(--text)}

main{padding:40px 48px 80px;max-width:980px;width:100%}
.top{display:flex;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.top .ttl{flex:1;min-width:220px}
.eyebrow{font-size:12.5px;color:var(--muted);margin-bottom:4px}
h1{font:600 30px/1.15 var(--display);letter-spacing:-.025em;margin:0}
.searchbox{position:relative;width:260px}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:var(--surface);outline:none;transition:border-color .15s}
.searchbox input:focus{border-color:var(--line2)}
.searchbox input::placeholder{color:var(--muted)}

/* ---------- сводка ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:36px}
.stat{background:var(--surface);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--line)}
body:not(.dark) .stat{border-color:transparent}
.stat .n{font:600 26px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.stat.warn .n{color:var(--warn)}
.stat .names{font-size:12.5px;color:var(--text2);margin-top:10px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notice{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text2);padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);margin-bottom:24px}
.notice .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
.notice a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line2)}
.notice .x{margin-left:auto;padding:4px}

/* ---------- секции и списки ---------- */
.sec{display:flex;align-items:baseline;gap:10px;margin:34px 0 10px}
.sec:first-child{margin-top:0}
.sec h2{font:600 13px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.sec .aux{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
body:not(.dark) .card{border-color:transparent}
.list .row{display:flex;gap:14px;align-items:flex-start;padding:13px 18px;border-top:1px solid var(--line);position:relative}
.list .row:first-child{border-top:0}
.list .row:hover{background:color-mix(in srgb,var(--sunken) 45%,transparent)}
.list .row:first-child:hover{border-radius:var(--radius) var(--radius) 0 0}
.list .row:last-child:hover{border-radius:0 0 var(--radius) var(--radius)}
.list .row:only-child:hover{border-radius:var(--radius)}
.check{appearance:none;-webkit-appearance:none;width:19px;height:19px;border:1.5px solid var(--line2);border-radius:50%;margin:1px 0 0;flex:none;display:grid;place-items:center;transition:.15s;background:transparent}
.check:hover{border-color:var(--accent)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:9px;height:5px;border:1.8px solid var(--on-accent);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.glyph{width:19px;height:19px;flex:none;color:var(--muted);display:grid;place-items:center;margin-top:1px}
.row .body{flex:1;min-width:0;cursor:pointer}
.row .title{font-weight:500;color:var(--text);word-wrap:break-word}
.row.done .title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.row .desc{color:var(--text2);font-size:13.5px;white-space:pre-wrap;word-wrap:break-word;margin-top:2px}
.row.done .desc{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .warn{color:var(--warn)}
.meta .acc{color:var(--accent)}
.row.memorial .title{color:var(--text2);font-weight:450}
.memlabel{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.cal .ev.mem::before{background:transparent;border:1px solid var(--muted);width:4px;height:4px}
.cal .ev.mem{color:var(--muted)}
.flag{color:var(--warn);margin-left:6px;vertical-align:-2px}
.row .acts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.row:hover .acts,.row:focus-within .acts{opacity:1}
.acts button{border:0;background:transparent;color:var(--muted);padding:5px;border-radius:7px;display:grid}
.acts button:hover{background:var(--sunken);color:var(--text)}
.empty{padding:26px 18px;color:var(--muted);font-size:13.5px;text-align:center}

/* ---------- панель раздела ---------- */
.composer{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 18px;margin-bottom:14px}
.composer svg{color:var(--muted)}
.composer input{flex:1;border:0;background:transparent;outline:none;padding:9px 0}
.composer input::placeholder{color:var(--muted)}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:8px 14px;font-weight:550;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.06)}
.btn.soft{background:var(--sunken);color:var(--text)}
.btn.soft:hover{filter:none;background:var(--line)}
.btn.line{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--line2)}
.bar{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chips{display:flex;gap:2px;background:var(--sunken);padding:3px;border-radius:10px}
.chips button{border:0;background:transparent;color:var(--text2);padding:5px 11px;border-radius:8px;font-size:13px}
.chips button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:550}
body.dark .chips button.on{background:var(--line2)}
.bar .linkbtn{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:13px;padding:5px 6px}
.bar .linkbtn:hover{color:var(--text)}

/* ---------- календарь ---------- */
.calnav{display:flex;align-items:center;gap:4px}
.calnav .m{font:600 16px var(--display);min-width:150px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);overflow:hidden}
.cal .dow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 8px;font-weight:600}
.cal .day{min-height:96px;padding:8px 8px 6px;border-top:1px solid var(--line);border-left:1px solid var(--line);cursor:pointer;min-width:0}
.cal .day:nth-child(7n+1){border-left:0}
.cal .day:hover{background:color-mix(in srgb,var(--sunken) 50%,transparent)}
.cal .day.other .num{color:var(--line2)}
.cal .day.other .ev{opacity:.45}
.cal .day.sel{background:var(--accent-soft)}
.cal .num{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text2);width:24px;height:24px;display:grid;place-items:center;border-radius:50%;margin:-3px 0 3px -3px}
.cal .day.today .num{background:var(--accent);color:var(--on-accent);font-weight:600}
.cal .ev{font-size:11.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);display:flex;align-items:center;gap:5px;margin-top:2px}
.cal .ev::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--muted);flex:none}
.cal .ev.home::before{background:transparent;border:1px solid var(--muted);width:4px;height:4px}
.cal .ev.done{text-decoration:line-through;color:var(--muted)}
.cal .ev.date::before{background:var(--accent)}
.cal .more{font-size:11px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block}
.legend i.o{background:transparent;border:1px solid var(--muted);width:5px;height:5px}
.legend i.a{background:var(--accent)}

/* ---------- модальное окно ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,20,18,.32);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.show{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:18px;padding:26px 28px 22px;width:100%;max-width:540px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.modal h3{font:600 19px var(--display);letter-spacing:-.015em;margin:0 0 20px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--line2);background:var(--surface)}
.field textarea{min-height:84px;resize:vertical}
.field .big{font-size:17px;font-weight:500;border:0!important;background:transparent!important;padding:2px 0 10px!important;border-bottom:1px solid var(--line)!important;border-radius:0!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:2px;background:var(--sunken);padding:3px;border-radius:10px}
.seg button{flex:1;border:0;background:transparent;padding:6px 8px;border-radius:8px;color:var(--text2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:550}
body.dark .seg button.on{background:var(--line2)}
.cb{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--text2);cursor:pointer}
.cb input{accent-color:var(--accent);width:16px;height:16px}
.hint{font-size:12.5px;color:var(--muted)}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;align-items:center}
.settings .blk{padding:16px 0;border-top:1px solid var(--line)}
.settings .blk:first-of-type{border-top:0;padding-top:0}
.settings .blk b{font-weight:550}
.settings .blk p{margin:4px 0 12px}
.settings .bar{margin:0}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,8px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:30;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast a{color:inherit;opacity:.7;margin-left:12px}

#signin{position:fixed;inset:0;background:var(--bg);z-index:40;display:grid;place-items:center;padding:20px}
.signcard{max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.signcard .mark{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.signcard .mark svg{width:26px;height:26px;stroke-width:2.2}
.fab{display:none}
#loadmsg{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:25;box-shadow:var(--shadow)}
@media(max-width:860px){
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:22px;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:15}
  .fab svg{width:24px;height:24px;stroke-width:2}
  aside{flex-wrap:nowrap!important;overflow-x:auto;gap:4px!important;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  aside::-webkit-scrollbar{display:none}
  aside .brand{display:none}
  aside .nav{white-space:nowrap;flex:none;padding:7px 12px}
  .aside-foot .ghostbtn span{display:none}
  .stat .names{display:none}
  .row .acts{opacity:1}
  .top{margin-bottom:18px} h1{font-size:25px}
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:6px 10px;width:100%}.navgroup{display:none}.nav{width:auto}.nav .cnt{margin-left:4px}
  .aside-foot{margin:0 0 0 auto;padding:0}
  main{padding:24px 18px 60px}.cols{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .searchbox{width:100%}.cal .day{min-height:64px}.cal .ev{font-size:0}.cal .ev::before{width:6px;height:6px}
}
</style>
</head>

    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>

    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
  </defs>

<div class="app">
  <aside id="aside"></aside>
  <main id="main"></main>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<button class="fab" data-act="add" title="Добавить"><svg class="i"><use href="#i-plus"/></svg></button>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="firebase-config.js"></script>
<script>
"use strict";
const ic = (n, cls) => `<svg class="i ${cls||""}"><use href="#i-${n}"/></svg>`;

/* ================= Данные ================= */
const KEY = "organizer.v1";
const TYPES = {
  task: {name:"Задачи", icon:"task", one:"задачу"},
  idea: {name:"Идеи", icon:"idea", one:"идею"},
  date: {name:"Дни рождения и даты", short:"Памятные даты", icon:"gift", one:"дату"},
  appt: {name:"Врачи и встречи", icon:"appt", one:"запись"},
  shop: {name:"Покупки", icon:"bag", one:"покупку"}
};
const BLOCK_TYPES = { work:["task","appt","idea","date"], home:["task","appt","date","idea","shop"] };
const BLOCKS = { work:"Работа", home:"Дом" };
const PRIO = { high:"Важно", normal:"Обычно", low:"Не срочно" };
const RECUR = { none:"Не повторять", daily:"Каждый день", weekdays:"По будням", weekly:"Каждую неделю", monthly:"Каждый месяц", yearly:"Каждый год" };
const DEFAULT_REMIND = { task:1, idea:0, date:3, appt:1, shop:0 };

const FB_CONF = window.FIREBASE_CONFIG || null;
const LOCAL = !FB_CONF;
const LKEY = LOCAL ? KEY : KEY+".cloud";
let CLOUD = null, cloudReady = false;
const synced = new Map(), pending = new Map();
let wq = Promise.resolve();
let state = load();
let ui = { view:"today", sub:{work:"task", home:"task"}, filter:"active", sort:"date", search:"", calMonth:null, calSel:null, noticeHidden:false };

function load(){
  try{ const s=JSON.parse(localStorage.getItem(LKEY)); if(s && !LOCAL) s.items=[]; if(s && Array.isArray(s.items)) return Object.assign({settings:{},notified:{}}, s); }catch(e){}
  return { items:[], settings:{}, notified:{} };
}
function canon(o){ return JSON.stringify(o, Object.keys(o).filter(k=>o[k]!==undefined).sort()); }
function save(){
  try{ localStorage.setItem(LKEY, JSON.stringify(LOCAL ? state : {settings:state.settings, notified:state.notified, items:[]})); }catch(e){}
  if(!CLOUD || !cloudReady) return;
  const now=new Map(state.items.map(i=>[i.id,canon(i)]));
  const known=new Map(synced); pending.forEach((v,k)=>{ if(v===null) known.delete(k); else known.set(k,v); });
  now.forEach((j,id)=>{ if(known.get(id)!==j) push(id,j); });
  known.forEach((j,id)=>{ if(!now.has(id)) push(id,null); });
}
function push(id,j){
  pending.set(id,j);
  wq = wq.then(async()=>{
    if(!pending.has(id)) return;
    const v=pending.get(id), ref=CLOUD.doc("items/"+id);
    try{ if(v===null) await ref.delete(); else await ref.set(JSON.parse(v)); }
    catch(e){
      if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ if(v===null) await ref.delete(); else await ref.set(JSON.parse(v)); }catch(e2){ toast("Не удалось сохранить, проверьте интернет"); } }
      else toast(e && e.code==="quota_exceeded" ? "Хранилище заполнено" : "Не удалось сохранить");
    }
    if(pending.get(id)===v) pending.delete(id);
  });
}
function applyRemote(){
  const m=new Map(synced); pending.forEach((v,k)=>{ if(v===null) m.delete(k); else m.set(k,v); });
  state.items=[...m.values()].map(j=>JSON.parse(j));
}
let dirty=false;
function softRender(){
  const a=document.activeElement;
  if($("#overlay").classList.contains("show") || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.id!=="search")){ dirty=true; return; }
  dirty=false; render();
}
document.addEventListener("focusout",()=>setTimeout(()=>{ if(dirty) softRender(); },50));
let FB=null, cfg={}, cfgRef=null, user=null;
(function(){ const h=location.hash.match(/^#key-([A-Za-z0-9_-]{16,})$/); if(h){ try{ sessionStorage.setItem("org.key",h[1]); }catch(e){} history.replaceState(null,"",location.pathname+location.search); } })();
async function startCloud(){
  let m;
  try{ m=await import("./firebase.js"); }catch(e){ showLoad("Не удалось загрузить органайзер. Проверьте интернет и обновите страницу."); return; }
  const app=m.initializeApp(FB_CONF), auth=m.getAuth(app);
  const fs=m.initializeFirestore(app,{localCache:m.persistentLocalCache({tabManager:m.persistentMultipleTabManager()})});
  FB={m,auth,fs};
  try{ await m.getRedirectResult(auth); }catch(e){}
  let unsub=null;
  m.onAuthStateChanged(auth,u=>{
    if(unsub){ unsub(); unsub=null; }
    user=u;
    if(!u){ showSignIn(); return; }
    hideSignIn();
    const col=m.collection(fs,"users",u.uid,"items");
    // Firestore сам хранит изменения офлайн и отправляет их позже, поэтому не ждём подтверждения
    CLOUD={ doc:p=>{ const id=p.split("/")[1], ref=m.doc(fs,"users",u.uid,"items",id);
      return { set:d=>{ m.setDoc(ref,d).catch(()=>toast("Не удалось сохранить")); return Promise.resolve(); },
               delete:()=>{ m.deleteDoc(ref).catch(()=>{}); return Promise.resolve(); } }; } };
    cfgRef=m.doc(fs,"users",u.uid,"meta","config");
    let cfgLoaded=false, itemsServer=false;
    const u2=m.onSnapshot(cfgRef,{includeMetadataChanges:true},snap=>{ cfg=snap.exists()?snap.data():{}; if(!snap.metadata.fromCache){ cfgLoaded=true; afterSync(); } });
    const u1=m.onSnapshot(col,{includeMetadataChanges:true},snap=>{
      synced.clear();
      snap.docs.forEach(d=>{ const o=Object.assign({},d.data(),{id:d.id}); synced.set(d.id,canon(o)); });
      const first=!cloudReady; cloudReady=true; applyRemote();
      if(!snap.metadata.fromCache && !itemsServer){ itemsServer=true; afterSync(); }
      if(first){ showLoad(null); render(); checkNotify(); } else softRender();
    }, err=>showLoad("Нет доступа к данным: "+(err&&err.code||"")));
    unsub=()=>{ u1(); u2(); };
    function afterSync(){ if(cfgLoaded && itemsServer){ firstServerSync(); } }
  });
}
let didFirstSync=false;
async function firstServerSync(){
  if(didFirstSync) return; didFirstSync=true;
  // ключ для задач от Claude — один раз из ссылки вида …/organizer/#key-XXXX
  let hk=null; try{ hk=sessionStorage.getItem("org.key"); }catch(e){}
  if(hk){ await saveCfg({inboxKey:hk}); try{ sessionStorage.removeItem("org.key"); }catch(e){} toast("Связь с Claude настроена"); }
  if(!cfg.seededV1){ const n=seedBirthdays(); save(); await saveCfg({seededV1:true}); if(n) toast("Добавлены дни рождения: "+n); render(); }
  checkInbox(); setInterval(checkInbox, 10*60*1000);
}
function saveCfg(patch){ cfg=Object.assign({},cfg,patch); return FB.m.setDoc(cfgRef,patch,{merge:true}).catch(()=>{}); }

/* ---- задачи от Claude: зашифрованный список inbox.json рядом со страницей ---- */
async function inboxKey(){
  const raw=new TextEncoder().encode(cfg.inboxKey);
  const base=await crypto.subtle.importKey("raw",raw,"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:new TextEncoder().encode("organizer-inbox-v1"),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function checkInbox(){
  if(!cfg.inboxKey || !cloudReady) return;
  let list; try{ const r=await fetch("inbox.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return; list=await r.json(); }catch(e){ return; }
  const done=new Set(cfg.imported||[]), fresh=(list.entries||[]).filter(e=>e && e.id && !done.has(e.id));
  if(!fresh.length) return;
  let key; try{ key=await inboxKey(); }catch(e){ return; }
  const added=[];
  for(const e of fresh){
    try{
      const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},key,b64(e.ct));
      const o=JSON.parse(new TextDecoder().decode(pt));
      if(o.op==="delete"){ state.items=state.items.filter(i=>i.id!==o.id); }
      else { const it=cleanItem(o); if(it){ const k=state.items.findIndex(i=>i.id===it.id); if(k>=0) state.items[k]=Object.assign({},state.items[k],it); else state.items.push(it); added.push(it.title); } }
      done.add(e.id);
    }catch(err){ /* чужой ключ или повреждённая запись — пропускаем */ }
  }
  save(); await saveCfg({imported:[...done].slice(-2000)}); render();
  if(added.length) toast("От Claude: "+added.join(", "));
}
function cleanItem(o){
  if(!o || typeof o.title!=="string" || !o.title.trim()) return null;
  const pick=(v,list,def)=>list.includes(v)?v:def, str=v=>typeof v==="string"?v.slice(0,2000):"";
  const dateOk=v=>typeof v==="string"&&/^\d{4}-\d\d-\d\d$/.test(v)?v:"";
  const it={ id:/^[A-Za-z0-9_-]{4,40}$/.test(o.id||"")?o.id:"c-"+uid(), created:Date.now(), done:!!o.done,
    block:pick(o.block,["work","home"],"home"), type:pick(o.type,Object.keys(TYPES),"task"), title:o.title.trim().slice(0,300),
    desc:str(o.desc), date:dateOk(o.date), time:typeof o.time==="string"&&/^\d\d:\d\d$/.test(o.time)?o.time:"", place:str(o.place),
    priority:pick(o.priority,["high","normal","low"],"normal"), recur:pick(o.recur,Object.keys(RECUR),"none"),
    remind:Number.isFinite(o.remind)?Math.max(0,Math.min(60,o.remind)):null, hasYear:!!o.hasYear, memorial:!!o.memorial };
  if(!BLOCK_TYPES[it.block].includes(it.type)) it.block = it.type==="shop"?"home":it.block;
  return it;
}

/* ---- экран входа ---- */
function showSignIn(){
  showLoad(null);
  let el=$("#signin");
  if(!el){ el=document.createElement("div"); el.id="signin"; document.body.appendChild(el); }
  el.innerHTML=`<div class="signcard"><span class="mark"><svg class="i"><use href="#i-check"/></svg></span><h1>Органайзер</h1>
    <p class="hint">Войдите через Google, чтобы записи были одинаковыми на компьютере и телефоне.</p>
    <button class="btn" id="gIn" style="width:100%;justify-content:center;padding:11px">Войти через Google</button>
    <p class="hint" id="gErr" style="color:var(--warn)"></p></div>`;
  $("#gIn").onclick=async()=>{
    const prov=new FB.m.GoogleAuthProvider();
    try{ await FB.m.signInWithPopup(FB.auth,prov); }
    catch(e){
      if(e && /popup|cancelled|operation-not-supported/.test(e.code||"")){ try{ await FB.m.signInWithRedirect(FB.auth,prov); return; }catch(e2){} }
      if(e && e.code==="auth/network-request-failed") $("#gErr").textContent="Нет интернета. Для первого входа нужен интернет.";
      else if(e && e.code==="auth/unauthorized-domain") $("#gErr").textContent="Этот адрес не добавлен в Firebase (Authorized domains).";
      else $("#gErr").textContent="Не получилось войти"+(e&&e.code?" ("+e.code+")":"");
    }
  };
}
function hideSignIn(){ const el=$("#signin"); if(el) el.remove(); }
function showLoad(msg){
  let el=$("#loadmsg");
  if(!msg){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement("div"); el.id="loadmsg"; el.className="notice"; document.body.appendChild(el); }
  el.innerHTML='<span class="dot"></span><span>'+esc(msg)+'</span>';
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ================= Даты ================= */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const todayISO = () => iso(new Date());
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONTHS_N = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const DOW = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
function human(s, withYear){ const d=parse(s); let t=d.getDate()+" "+MONTHS[d.getMonth()]; if(withYear || d.getFullYear()!==new Date().getFullYear()) t+=" "+d.getFullYear(); return t; }
function relDays(n){
  if(n===0) return "сегодня"; if(n===1) return "завтра"; if(n===-1) return "вчера"; if(n===2) return "послезавтра";
  const a=Math.abs(n), w=plural(a,"день","дня","дней"); return n>0 ? "через "+a+" "+w : a+" "+w+" назад";
}
function plural(n,one,few,many){ const m10=n%10,m100=n%100; if(m10===1&&m100!==11) return one; if(m10>=2&&m10<=4&&(m100<12||m100>14)) return few; return many; }
function stepDate(s, recur){
  const d=parse(s);
  switch(recur){
    case "daily": d.setDate(d.getDate()+1); break;
    case "weekdays": do{ d.setDate(d.getDate()+1);}while(d.getDay()===0||d.getDay()===6); break;
    case "weekly": d.setDate(d.getDate()+7); break;
    case "monthly": { const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+1); d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate())); break; }
    case "yearly": d.setFullYear(d.getFullYear()+1); break;
  }
  return iso(d);
}
function nextYearly(s, from){
  from = from || todayISO();
  const d=parse(s), f=parse(from);
  let n=new Date(f.getFullYear(), d.getMonth(), d.getDate());
  if(d.getMonth()===1 && d.getDate()===29 && n.getMonth()!==1) n=new Date(f.getFullYear(),1,28);
  if(iso(n)<from) n=new Date(f.getFullYear()+1, d.getMonth(), d.getDate());
  return iso(n);
}
function effDate(it){ if(!it.date) return null; return it.type==="date" ? nextYearly(it.date) : it.date; }
function remindDays(it){ return it.remind==null ? DEFAULT_REMIND[it.type] : Number(it.remind); }
function status(it){
  const t=todayISO(), d=effDate(it);
  if(!d || (it.done && it.type!=="date")) return null;
  const n=diffDays(t,d);
  if(n<0) return {kind:"overdue",n}; if(n===0) return {kind:"today",n};
  if(n<=Math.max(remindDays(it),0)) return {kind:"soon",n};
  return {kind:"later",n};
}

/* ================= Утилиты ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function matches(it,q){ q=q.toLowerCase(); return (it.title+" "+(it.desc||"")+" "+(it.place||"")).toLowerCase().includes(q); }
const isActive = i => i.type==="date" || !i.done;

/* ================= Боковое меню ================= */
function renderAside(){
  const r=reminders(), hot=r.overdue.length+r.today.length;
  const nav = (view, sub, icon, label, cnt, hotCnt) => {
    const active = !ui.search && ui.view===view && (!sub || ui.sub[view]===sub);
    return `<button class="nav ${active?"active":""}" data-view="${view}" ${sub?`data-sub="${sub}"`:""}>${ic(icon)}<span>${label}</span><span class="cnt ${hotCnt?"hot":""}">${cnt||""}</span></button>`;
  };
  let h=`<div class="brand"><span class="mark"><svg class="i"><use href="#i-check"/></svg></span><b>Органайзер</b></div>`;
  h+=nav("today",null,"today","Сегодня",hot,hot);
  h+=nav("calendar",null,"cal","Календарь");
  ["work","home"].forEach(b=>{
    h+=`<div class="navgroup">${BLOCKS[b]}</div>`;
    BLOCK_TYPES[b].forEach(t=>{
      const items=state.items.filter(i=>i.block===b&&i.type===t&&isActive(i));
      const late=items.filter(i=>{const s=status(i);return s&&(s.kind==="overdue"||s.kind==="today");}).length;
      h+=nav(b,t,TYPES[t].icon,t==="date"?TYPES[t].short:TYPES[t].name,items.length,late);
    });
  });
  const dark=document.body.classList.contains("dark");
  h+=`<div class="aside-foot"><button class="ghostbtn" data-act="theme" title="${dark?"Светлая тема":"Тёмная тема"}">${ic(dark?"sun":"moon")}</button><button class="ghostbtn" data-act="settings" title="Настройки и резервная копия">${ic("settings")}<span>Настройки</span></button></div>`;
  $("#aside").innerHTML=h;
}

/* ================= Основная область ================= */
function render(){
  renderAside();
  const m=$("#main");
  const keepSearch = document.activeElement && document.activeElement.id==="search";
  const caret = keepSearch ? document.activeElement.selectionStart : null;
  let title, eyebrow, body;
  const d=new Date();
  if(ui.search){ title="Поиск"; eyebrow="По всем разделам"; body=renderSearch(); }
  else if(ui.view==="today"){ title="Сегодня"; eyebrow=cap(DOW[d.getDay()])+", "+human(todayISO(),true); body=renderToday(); }
  else if(ui.view==="calendar"){ title=MONTHS_N[(ui.calMonth||{m:d.getMonth()}).m]+" "+(ui.calMonth||{y:d.getFullYear()}).y; eyebrow="Календарь"; body=renderCalendar(); }
  else { title=TYPES[ui.sub[ui.view]].name; eyebrow=BLOCKS[ui.view]; body=renderNotice()+renderBlock(ui.view); }
  m.innerHTML=`<div class="top"><div class="ttl"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div>
    ${ui.view==="calendar"&&!ui.search?`<div class="calnav"><button class="ghostbtn" data-cal="-1" title="Предыдущий месяц">${ic("left")}</button><button class="btn soft" data-cal="0">Сегодня</button><button class="ghostbtn" data-cal="1" title="Следующий месяц">${ic("right")}</button></div>`:""}
    <label class="searchbox">${ic("search","s")}<input id="search" type="search" placeholder="Поиск" value="${esc(ui.search)}" autocomplete="off"></label></div>`+body;
  if(keepSearch){ const s=$("#search"); s.focus(); s.setSelectionRange(caret,caret); }
  if($("#filterSel")) $("#filterSel").value=ui.filter;
  updateTitle();
}
const cap = s => s[0].toUpperCase()+s.slice(1);

function reminders(){
  const r={overdue:[],today:[],soon:[]};
  state.items.forEach(it=>{ const s=status(it); if(s && r[s.kind]) r[s.kind].push(it); });
  const by=(a,b)=>effDate(a).localeCompare(effDate(b));
  r.overdue.sort(by); r.soon.sort(by); return r;
}
function updateTitle(){ const r=reminders(), n=r.overdue.length+r.today.length; document.title=(n?"("+n+") ":"")+"Органайзер"; }

function renderStats(){
  const r=reminders();
  const st=(arr,label,cls)=>`<div class="stat ${arr.length&&cls?cls:""}"><div class="n">${arr.length}</div><div class="l">${label}</div>${arr.length?`<div class="names">${arr.map(i=>esc(i.title)).join(", ")}</div>`:""}</div>`;
  return `<div class="stats">${st(r.overdue,"просрочено","warn")}${st(r.today,"на сегодня")}${st(r.soon,"скоро")}</div>`;
}
function renderNotice(){
  if(ui.noticeHidden) return "";
  const r=reminders(), arr=r.overdue.concat(r.today);
  if(!arr.length) return "";
  return `<div class="notice"><span class="dot"></span><span>${r.overdue.length?`Просрочено: ${r.overdue.length}`:""}${r.overdue.length&&r.today.length?" · ":""}${r.today.length?`На сегодня: ${r.today.length}`:""}</span>
    <a href="#" data-view="today">Открыть «Сегодня»</a><button class="ghostbtn x" data-act="hideNotice" title="Скрыть">${ic("x","s")}</button></div>`;
}

function itemHTML(it, opts){
  opts=opts||{};
  const s=status(it), d=effDate(it), meta=[];
  if(opts.showBlock) meta.push(`<span>${ic(it.block,"s")}${BLOCKS[it.block]} · ${(TYPES[it.type].short||TYPES[it.type].name).toLowerCase()}</span>`);
  if(d){
    const cls = s && s.kind==="overdue" ? "warn" : s && (s.kind==="today") ? "acc" : "";
    if(it.type==="date"){
      const age = it.hasYear ? parse(d).getFullYear()-parse(it.date).getFullYear() : null;
      if(it.memorial) meta.push(`<span>${ic("cal","s")}${human(d)}, ${relDays(diffDays(todayISO(),d))}${age?` · ${age} ${plural(age,"год","года","лет")} со дня рождения`:""}</span>`);
      else meta.push(`<span class="${cls}">${ic("gift","s")}${human(d)}, ${relDays(diffDays(todayISO(),d))}${age?` · исполнится ${age}`:""}</span>`);
    } else {
      meta.push(`<span class="${cls}">${ic("cal","s")}${human(d)}${it.done?"":", "+relDays(diffDays(todayISO(),d))}</span>`);
    }
  }
  if(it.time) meta.push(`<span>${ic("clock","s")}${it.time}</span>`);
  if(it.place) meta.push(`<span>${ic("pin","s")}${esc(it.place)}</span>`);
  if(it.recur && it.recur!=="none" && it.type!=="date") meta.push(`<span>${ic("repeat","s")}${RECUR[it.recur].toLowerCase()}</span>`);
  if(it.done && it.doneAt) meta.push(`<span>${ic("check","s")}сделано ${human(it.doneAt)}</span>`);
  const lead = it.type==="date" ? `<span class="glyph">${ic(it.memorial?"candle":"gift")}</span>` : `<input type="checkbox" class="check" data-toggle="${it.id}" ${it.done?"checked":""} title="Отметить как сделано">`;
  return `<div class="row ${it.done&&it.type!=="date"?"done":""} ${it.memorial?"memorial":""}">
    ${lead}
    <div class="body" data-open="${it.id}">
      <div class="title">${esc(it.title)}${it.memorial?`<span class="memlabel">светлая память</span>`:""}${it.priority==="high"&&!it.done?`<svg class="i s flag"><use href="#i-flag"/></svg>`:""}</div>
      ${it.desc?`<div class="desc">${esc(it.desc)}</div>`:""}
      ${meta.length?`<div class="meta">${meta.join("")}</div>`:""}
    </div>
    <div class="acts"><button data-open="${it.id}" title="Изменить">${ic("edit","s")}</button><button data-del="${it.id}" title="Удалить">${ic("trash","s")}</button></div>
  </div>`;
}
const listHTML = (arr, empty, opts) => `<div class="card list">${arr.length?arr.map(i=>itemHTML(i,opts)).join(""):`<div class="empty">${empty}</div>`}</div>`;

function sortItems(arr, mode){
  const pr={high:0,normal:1,low:2};
  return arr.slice().sort((a,b)=>{
    if(a.done!==b.done && a.type!=="date" && b.type!=="date") return a.done?1:-1;
    if(mode==="prio"){ const p=pr[a.priority||"normal"]-pr[b.priority||"normal"]; if(p) return p; }
    if(mode==="created") return (b.created||0)-(a.created||0);
    const da=effDate(a)||"9999", db=effDate(b)||"9999";
    if(da!==db) return da.localeCompare(db);
    if((a.time||"")!==(b.time||"")) return (a.time||"99").localeCompare(b.time||"99");
    return pr[a.priority||"normal"]-pr[b.priority||"normal"];
  });
}

function renderBlock(block){
  const sub=ui.sub[block];

  if(sub!=="date"){ if(ui.filter==="active") items=items.filter(i=>!i.done); if(ui.filter==="done") items=items.filter(i=>i.done); }
  items=sortItems(items, ui.sort);
  const doneCount=state.items.filter(i=>i.block===block&&i.type===sub&&i.done&&sub!=="date").length;
  const chip=(grp,v,l)=>`<button data-${grp}="${v}" class="${ui[grp]===v?"on":""}">${l}</button>`;
  return `<div class="card composer">${ic("plus")}<input id="quickAdd" placeholder="Добавить ${TYPES[sub].one}… и нажать Enter"><button class="btn soft" data-act="add">Подробнее</button></div>

function renderToday(){

  const dates=state.items.filter(i=>i.type==="date"&&i.date).sort((a,b)=>effDate(a).localeCompare(effDate(b))).slice(0,5);

function renderSearch(){

  return `<div class="sec"><h2>Найдено: ${res.length}</h2><span class="aux">«${esc(ui.search)}»</span></div>${listHTML(res,"Ничего не найдено",{showBlock:true})}`;

function occurrences(it, from, to){
  if(!it.date) return [];
  if(it.type==="date"){ const out=[]; for(let y=parse(from).getFullYear(); y<=parse(to).getFullYear(); y++){ const s=nextYearly(it.date,y+"-01-01"); if(s>=from&&s<=to) out.push(s); } return out; }
  if(!it.recur||it.recur==="none"||it.done) return (it.date>=from&&it.date<=to)?[it.date]:[];
  const out=[]; let d=it.date, g=0; while(d<=to && g++<800){ if(d>=from) out.push(d); d=stepDate(d,it.recur); } return out;
}

function renderCalendar(){
  const now=new Date();
  if(!ui.calMonth) ui.calMonth={y:now.getFullYear(), m:now.getMonth()};
  const {y,m}=ui.calMonth, first=new Date(y,m,1), shift=(first.getDay()+6)%7, start=new Date(y,m,1-shift);
  const days=[]; for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); days.push(d); }
  const from=iso(days[0]), to=iso(days[41]), map={};
  state.items.forEach(it=>{ if(it.type==="idea"||it.type==="shop") return; occurrences(it,from,to).forEach(s=>(map[s]=map[s]||[]).push(it)); });
  Object.values(map).forEach(a=>a.sort((p,q)=>(p.time||"99").localeCompare(q.time||"99")));
  const t=todayISO();
  let h=`<div class="card cal">`;
  ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(d=>h+=`<div class="dow">${d}</div>`);
  days.forEach(d=>{
    const s=iso(d), evs=map[s]||[];
    h+=`<div class="day ${d.getMonth()!==m?"other":""} ${s===t?"today":""} ${s===ui.calSel?"sel":""}" data-day="${s}"><div class="num">${d.getDate()}</div>`;
    evs.slice(0,3).forEach(it=>h+=`<div class="ev ${it.block} ${it.type==="date"?(it.memorial?"mem":"date"):""} ${it.done&&it.type!=="date"?"done":""}">${it.time?it.time+" ":""}${esc(it.title)}</div>`);
    if(evs.length>3) h+=`<div class="more">ещё ${evs.length-3}</div>`;
    h+=`</div>`;
  });
  h+=`</div><div class="legend"><span><i></i>Работа</span><span><i class="o"></i>Дом</span><span><i class="a"></i>Памятные даты</span></div>`;
  if(ui.calSel){
    h+=`<div class="sec"><h2>${human(ui.calSel,true)}, ${DOW[parse(ui.calSel).getDay()]}</h2><span class="aux"></span></div>
      ${listHTML(map[ui.calSel]||[],"Свободный день",{showBlock:true})}
      <div style="margin-top:12px"><button class="btn soft" data-act="addOnDay">${ic("plus","s")}Добавить на этот день</button></div>`;
  }
  return h;
}

function ask(msg, okLabel, cancelLabel){
  return new Promise(res=>{
    $("#modal").innerHTML=`<h3 style="margin-bottom:10px">${esc(msg).replace(/\n/g,"<br>")}</h3><div class="foot"><button class="btn line" id="aNo">${cancelLabel||"Отмена"}</button><button class="btn" id="aYes">${okLabel||"Да"}</button></div>`;
    $("#overlay").classList.add("show");
    $("#aYes").onclick=()=>{ closeModal(); res(true); };
    $("#aNo").onclick=()=>{ closeModal(); res(false); };
    $("#modal")._cancel=()=>res(false);
  });
}
function closeModal(){ $("#overlay").classList.remove("show"); }

function removeItem(id){
  const idx=state.items.findIndex(i=>i.id===id); if(idx<0) return;
  const [it]=state.items.splice(idx,1); save(); render();
  const t=$("#toast"); t.innerHTML=`Удалено: ${esc(it.title)}<a href="#">Вернуть</a>`; t.style.pointerEvents="auto"; t.classList.add("show");
  t.querySelector("a").onclick=e=>{ e.preventDefault(); state.items.splice(idx,0,it); save(); render(); t.classList.remove("show"); };
  clearTimeout(t._h); t._h=setTimeout(()=>{ t.classList.remove("show"); t.style.pointerEvents="none"; },5000);
}
function toggleDone(id){
  const it=state.items.find(i=>i.id===id); if(!it) return;
  if(!it.done && it.recur && it.recur!=="none" && it.date){
    let next=stepDate(it.date,it.recur); while(next<todayISO() && it.recur!=="yearly") next=stepDate(next,it.recur);
    it.date=next; it.lastDone=todayISO(); it.timesDone=(it.timesDone||0)+1;
    save(); setTimeout(()=>{ render(); toast("Готово. Следующий раз — "+human(next)); },250); return;
  }
  it.done=!it.done; it.doneAt=it.done?todayISO():null; save();
  setTimeout(render, it.done?250:0);
}

const normName = s => String(s||"").toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9]/g,"");
const dateKey = i => normName(i.title)+"|"+i.date.slice(5);
$("#importFile").onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result); if(!Array.isArray(data.items)) throw 0;
      const go=merge=>{ if(merge){ const ids=new Set(state.items.map(i=>i.id)), dk=new Set(state.items.filter(i=>i.type==="date"&&i.date).map(dateKey)); data.items.forEach(i=>{ if(i&&i.id&&!ids.has(i.id)&&!(i.type==="date"&&i.date&&dk.has(dateKey(i)))) state.items.push(i); }); } else state.items=data.items.filter(i=>i&&i.id);
        save(); closeModal(); render(); toast("Готово, записей в файле: "+data.items.length); };
      if(state.items.length) ask("Добавить записи из файла к текущим или заменить текущие?","Добавить","Заменить").then(go); else go(false);
    }catch(err){ toast("Не удалось прочитать файл: это не копия органайзера."); }
    e.target.value="";
  };
  r.readAsText(file);
};

function askNotif(manual){
  if(!("Notification" in window)){ if(manual) toast("Здесь системные уведомления недоступны. Напоминания видны на странице «Сегодня»."); return; }
  try{ Notification.requestPermission().then(p=>{ if(manual){ toast(p==="granted"?"Уведомления включены":"Уведомления не разрешены"); if($("#sClose")) openSettings(); } if(p==="granted") checkNotify(); }).catch(()=>{}); }catch(e){}
}
function notify(title, body, force){
  if("Notification" in window && Notification.permission==="granted"){ try{ const n=new Notification(title,{body}); n.onclick=()=>{ window.focus(); n.close(); }; return; }catch(e){} }
  if(force) toast(body);
}
const nm = i => i.memorial ? i.title+" (память)" : i.title;
function checkNotify(){
  state.notified=state.notified||{};
  const t=todayISO(), now=new Date(), r=reminders(), granted=("Notification" in window && Notification.permission==="granted");
  const key="summary-"+t;
  if(!state.notified[key] && (r.overdue.length||r.today.length||r.soon.length)){
    const parts=[];
    if(r.overdue.length) parts.push("Просрочено: "+r.overdue.map(nm).join(", "));
    if(r.today.length) parts.push("Сегодня: "+r.today.map(nm).join(", "));
    if(r.soon.length) parts.push("Скоро: "+r.soon.map(i=>nm(i)+" ("+relDays(diffDays(t,effDate(i)))+")").join(", "));
    notify("Органайзер", parts.join("\n")); if(granted) state.notified[key]=1;
  }
  state.items.forEach(it=>{
    if(it.done||!it.time||effDate(it)!==t) return;
    const [h,m]=it.time.split(":").map(Number), mins=h*60+m-(now.getHours()*60+now.getMinutes()), k="t-"+it.id+"-"+t+"-"+it.time;
    if(mins<=30 && mins>=-5 && !state.notified[k]){ notify(it.time+" · "+it.title,(it.place?it.place+"\n":"")+(it.desc||"")); if(granted) state.notified[k]=1; }
  });
  Object.keys(state.notified).forEach(k=>{ if(!k.includes(t)) delete state.notified[k]; });
  save();
}

function hashId(str){ let h1=5381,h2=52711; for(const ch of str){ const c=ch.codePointAt(0); h1=(h1*33)^c; h2=(h2*33)^c; } return (h1>>>0).toString(36)+(h2>>>0).toString(36); }
function seedBirthdays(){
  state.settings.seeded = state.settings.seeded || {};
  // убрать вымышленный пример «День рождения мамы», если он есть
  state.items = state.items.filter(i=>!(i.type==="date" && i.title==="День рождения мамы" && i.remind===5 && i.hasYear));
  const norm = s => s.toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9]/g,"");
  let added=0;
  SEED_BDAYS.trim().split("\n").forEach(line=>{
    const [b,title,dt,f1,f2]=line.split("|"), mem=(f1==="m"||f2==="m"), desc=(f1&&f1!=="m")?f1:(f2&&f2!=="m"?f2:"");
    const [dd,mm,yy]=dt.split("."), date=(yy||"2000")+"-"+mm+"-"+dd, key=norm(title)+"|"+mm+dd;
    if(state.settings.seeded[key]) return;
    state.settings.seeded[key]=1;
    if(state.items.some(i=>i.type==="date" && i.date && i.date.slice(5)===mm+"-"+dd && norm(i.title).includes(norm(title)))) return;
    state.items.push({id:"bd-"+hashId(key),created:Date.now(),block:b==="w"?"work":"home",type:"date",title,desc,date,hasYear:!!yy,memorial:mem,done:false,priority:"normal",recur:"none",remind:null});
    added++;
  });
  return added;
}

/* ================= События ================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-view],[data-open],[data-del],[data-act],[data-cal],[data-day],[data-filter],[data-sort]");
  if(!el) return;
  if(el.matches("a")) e.preventDefault();
  const d=el.dataset;
  if(d.view){ ui.view=d.view; if(d.sub) ui.sub[d.view]=d.sub; ui.search=""; render(); window.scrollTo(0,0); }
  else if(d.del){ removeItem(d.del); }
  else if(d.open){ const it=state.items.find(i=>i.id===d.open); if(it) openForm(it); }
  else if(d.filter){ ui.filter=d.filter; render(); }
  else if(d.sort){ ui.sort=d.sort; render(); }
  else if(d.cal!==undefined){ const n=Number(d.cal); if(n===0){ ui.calMonth=null; ui.calSel=todayISO(); } else { let {y,m}=ui.calMonth; m+=n; if(m<0){m=11;y--;} if(m>11){m=0;y++;} ui.calMonth={y,m}; } render(); }
  else if(d.day){ ui.calSel=ui.calSel===d.day?null:d.day; render(); }
  else if(d.act==="add") openForm();
  else if(d.act==="addOnDay") openForm(null,{date:ui.calSel,type:"task",block:"work"});
  else if(d.act==="hideNotice"){ ui.noticeHidden=true; render(); }
  else if(d.act==="theme"){ state.settings.theme=document.body.classList.contains("dark")?"light":"dark"; save(); applyTheme(); render(); }
  else if(d.act==="settings") openSettings();
  else if(d.act==="clearDone"){ const v=ui.view, s=ui.sub[v], n=state.items.filter(i=>i.block===v&&i.type===s&&i.done).length; ask("Удалить сделанные записи ("+n+")?","Удалить").then(ok=>{ if(ok){ state.items=state.items.filter(i=>!(i.block===v&&i.type===s&&i.done)); save(); render(); } }); }
});
document.addEventListener("change",e=>{ if(e.target.dataset.toggle) toggleDone(e.target.dataset.toggle); });
document.addEventListener("input",e=>{ if(e.target.id==="search"){ ui.search=e.target.value.trim(); render(); } });
document.addEventListener("keydown",e=>{
  if(e.target.id==="quickAdd" && e.key==="Enter" && e.target.value.trim()){
    const v=ui.view, type=ui.sub[v], title=e.target.value.trim();
    if(type==="date"){ openForm(null,{title,block:v,type}); return; }
    state.items.push({id:uid(),created:Date.now(),block:v,type,title,done:false,priority:"normal",recur:"none",remind:null});
    save(); render(); $("#quickAdd").focus(); toast("Добавлено. Нажмите на запись, чтобы указать срок.");
  }
  if(e.key==="Escape"){ if($("#overlay").classList.contains("show")) closeModal(); else if(ui.search){ ui.search=""; render(); } }
  if(e.key==="/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); $("#search").focus(); }
});
$("#overlay").addEventListener("mousedown",e=>{ if(e.target.id==="overlay") closeModal(); });
